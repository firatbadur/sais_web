{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'tr' }}">
<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{% block title %}{% trans "Envisoft WebX" %}{% endblock %} · Envisoft WebX</title>
    <link rel="shortcut icon" href="{% static 'images/logo/icon.png' %}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700">
    <link href="{% static 'dashboard/plugins/global/plugins.bundle.css' %}" rel="stylesheet">
    <link href="{% static 'dashboard/css/style.bundle.css' %}" rel="stylesheet">
    <style>
        :root {
            --ev-navy: #0b3566;
            --ev-blue: #1B84FF;
        }

        body#kt_body { background-color: #eef3f9; }

        /* ---- full-screen auth surface ---- */
        .ev-auth-surface {
            position: relative;
            overflow: hidden;
            min-height: 100vh;
            background: linear-gradient(160deg, #f4f7fb 0%, #e7eef7 100%);
        }
        /* faint SCADA monitoring grid */
        .ev-auth-surface::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(11,53,102,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(11,53,102,0.04) 1px, transparent 1px);
            background-size: 46px 46px;
            -webkit-mask-image: radial-gradient(circle at 50% 38%, #000 30%, transparent 80%);
            mask-image: radial-gradient(circle at 50% 38%, #000 30%, transparent 80%);
            pointer-events: none;
        }

        /* ---- form card ---- */
        .ev-form-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border: 1px solid rgba(11,53,102,0.07);
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(11,53,102,0.12), 0 4px 14px rgba(11,53,102,0.06);
        }
        .ev-form-card .form-control {
            height: calc(1.5em + 1.55rem + 2px);
            border-radius: 10px;
            background: #f6f9fd;
            border-color: #e3eaf3;
        }
        .ev-form-card .form-control:focus {
            background: #ffffff;
            border-color: var(--ev-blue);
            box-shadow: 0 0 0 0.2rem rgba(27,132,255,0.15);
        }
        /* gradient submit button */
        .ev-form-card .btn-primary {
            background: linear-gradient(150deg, var(--ev-navy) 0%, var(--ev-blue) 100%);
            border: none;
            padding-top: 0.85rem; padding-bottom: 0.85rem;
            box-shadow: 0 10px 24px rgba(27,132,255,0.30);
            transition: transform .12s ease, box-shadow .12s ease;
        }
        .ev-form-card .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 30px rgba(27,132,255,0.40);
        }

        /* ---- language segmented switch ---- */
        .ev-lang-switch {
            display: inline-flex;
            padding: 4px;
            gap: 2px;
            border-radius: 999px;
            background: rgba(11,53,102,0.06);
            border: 1px solid rgba(11,53,102,0.08);
        }
        .ev-lang-switch form { margin: 0; }
        .ev-lang-switch .ev-lang-btn {
            border: none;
            background: transparent;
            color: #5a6a7e;
            font-weight: 600;
            font-size: 0.82rem;
            line-height: 1;
            padding: 7px 16px;
            border-radius: 999px;
            cursor: pointer;
            transition: all .15s ease;
        }
        .ev-lang-switch .ev-lang-btn:hover { color: var(--ev-navy); }
        .ev-lang-switch .ev-lang-btn.active {
            background: #ffffff;
            color: var(--ev-blue);
            box-shadow: 0 2px 6px rgba(11,53,102,0.12);
            cursor: default;
        }
    </style>
</head>
<body id="kt_body" class="app-blank">
    <script>
    document.documentElement.setAttribute("data-bs-theme", "light");
    </script>

    <div class="d-flex flex-column flex-root" id="kt_app_root">
        <div class="ev-auth-surface d-flex flex-column flex-center flex-column-fluid p-10">

            <!-- FORM -->
            <div class="ev-form-card p-5 p-sm-10">
                {% block auth_content %}{% endblock %}
            </div>

            <!-- Auth footer -->
            <div class="d-flex flex-center flex-column gap-4 mt-10" style="position:relative; z-index:2;">
                <div class="ev-lang-switch">
                    {% for lang in dashboard_languages %}
                        <form method="post" action="{% url 'set_language' %}">
                            {% csrf_token %}
                            <input name="next" type="hidden" value="{{ request.get_full_path }}">
                            <input name="language" type="hidden" value="{{ lang.code }}">
                            <button type="submit" class="ev-lang-btn {% if LANGUAGE_CODE == lang.code %}active{% endif %}">
                                {{ lang.label }}
                            </button>
                        </form>
                    {% endfor %}
                </div>
                <span class="text-muted fs-7">© {% now "Y" %} Envisoft WebX</span>
            </div>

        </div>
    </div>
</body>
</html>
