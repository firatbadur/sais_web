name: sais_web

services:
  # Yedek volume'ünün izinlerini hazırla: SQL Server (uid 10001) yazsın,
  # app container'ları (farklı uid) listeleyip silebilsin/indirebilsin.
  backup_init:
    image: busybox
    command: sh -c "mkdir -p /backups && chmod 0777 /backups"
    volumes:
      - mssql_backups:/backups

  # Caddy config volume izinleri (web non-root app yazsın).
  caddy_config_init:
    image: busybox
    command: sh -c "mkdir -p /etc/caddy/certs && chmod -R 0777 /etc/caddy"
    volumes:
      - caddy_config:/etc/caddy

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD:-Envisoft-21!}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    volumes:
      - mssql_data:/var/opt/mssql
      - mssql_backups:/var/opt/mssql/backups
    depends_on:
      backup_init:
        condition: service_completed_successfully
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" || exit 1"
      ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      MSSQL_HOST: db
      MSSQL_PORT: 1433
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: django-db
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      MSSQL_DRIVER: "ODBC Driver 18 for SQL Server"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      caddy_config_init:
        condition: service_completed_successfully
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles_root
      - mssql_backups:/var/opt/mssql/backups
      - caddy_config:/etc/caddy
    # Dev'de doğrudan erişim için web :8000 publish KORUNUR; Caddy ayrıca 80/443'te.
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py ensure_database &&
             python manage.py migrate --noinput &&
             (python manage.py detect_power_off || true) &&
             python manage.py collectstatic --noinput &&
             python manage.py seed_periodic_tasks &&
             (python manage.py refresh_license || true) &&
             (python manage.py render_caddyfile || true) &&
             gunicorn sais_web.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile - --error-logfile -"

  # Dev reverse proxy — lokal doğrulama için (internal/self-signed mod).
  # Let's Encrypt dev'de çalışmaz; WebSettings tls_mode=internal ile test edin.
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
      caddy_config_init:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_config:/etc/caddy
      - caddy_data:/data
    command: caddy run --config /etc/caddy/Caddyfile --watch

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      MSSQL_HOST: db
      MSSQL_PORT: 1433
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: django-db
      MSSQL_DRIVER: "ODBC Driver 18 for SQL Server"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - mssql_backups:/var/opt/mssql/backups
    command: celery -A sais_web worker -l info --concurrency=4

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      MSSQL_HOST: db
      MSSQL_PORT: 1433
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: django-db
      MSSQL_DRIVER: "ODBC Driver 18 for SQL Server"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    command: celery -A sais_web beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

volumes:
  mssql_data:
  mssql_backups:
  redis_data:
  media_data:
  static_data:
  caddy_config:
  caddy_data:
