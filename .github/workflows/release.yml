name: release

# Sürüm çıkarma: bir git tag (vX.Y.Z) push edildiğinde tetiklenir.
# Her master push'ta DEĞİL — "bilinçli sürüm" kontrolü için sadece tag'ler.
#
#   git tag v1.2.0
#   git push origin v1.2.0
#
# Image GHCR'a iki tag ile yazılır:
#   ghcr.io/firatbadur/sais_web:v1.2.0   (değişmez — rollback için)
#   ghcr.io/firatbadur/sais_web:stable   (kayan — sahalardaki Watchtower bunu izler)

on:
  push:
    tags:
      - "v*"

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=stable

      - name: Build epoch (lisans grace çıpası)
        id: buildmeta
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            BUILD_EPOCH=${{ steps.buildmeta.outputs.epoch }}
            PRODUCTION=1
            OBFUSCATE=1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Windows "next-next-next" installer'ı (Inno Setup) derle ve Release'e ekle.
  # GHCR'daki image private olduğundan installer'a read:packages scope'lu bir PAT
  # gömülür (repo secret INSTALLER_GHCR_TOKEN). Asıl kullanım gate'i Ed25519 lisans.
  windows-installer:
    needs: build-push
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup + NSSM (Chocolatey)
        run: choco install innosetup nssm --no-progress -y

      - name: Stage NSSM into payload
        shell: pwsh
        run: |
          # nssm.cc istikrarsız (503) → choco paketinden 64-bit nssm.exe'yi al.
          $cands = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\NSSM" -Recurse -Filter nssm.exe
          $src = $cands | Where-Object { $_.FullName -match 'win64' } | Select-Object -First 1
          if (-not $src) { $src = $cands | Select-Object -First 1 }
          if (-not $src) { throw "nssm.exe choco paketinde bulunamadı." }
          New-Item -ItemType Directory -Force installer\payload | Out-Null
          Copy-Item $src.FullName installer\payload\nssm.exe -Force
          Write-Host "NSSM staged: $($src.FullName)"

      - name: Validate PowerShell scripts (parse)
        shell: powershell
        run: |
          # Hedef makinedeki Windows PowerShell 5.1 ile (pwsh 7 değil) doğrula:
          # 5.1, BOM'suz dosyayı ANSI okur → encoding bozulması parse hatası yapar.
          $bad = $false
          Get-ChildItem installer\scripts\*.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) {
              $bad = $true
              Write-Host "PARSE HATASI: $($_.Name)" -ForegroundColor Red
              $errs | ForEach-Object { Write-Host ("  Satir {0}: {1}" -f $_.Extent.StartLineNumber, $_.Message) }
            } else { Write-Host "OK: $($_.Name)" }
          }
          if ($bad) { throw "PowerShell script parse hatalari var (yukariya bakin)." }

      - name: Compile installer
        shell: pwsh
        env:
          GHCR_TOKEN: ${{ secrets.INSTALLER_GHCR_TOKEN }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc `
            "/DGHCR_USER=${{ github.repository_owner }}" `
            "/DGHCR_TOKEN=$env:GHCR_TOKEN" `
            "/DGHCR_IMAGE=ghcr.io/${{ github.repository }}" `
            "/DAPP_VERSION=${{ github.ref_name }}" `
            installer\sais_setup.iss

      - name: Attach installer to release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/dist/EnvisoftWebX-Setup-${{ github.ref_name }}.exe

  # Linux "tek-komut" installer (Windows installer'ın karşılığı). GHCR image
  # private olduğundan read:packages token'ı build-time script'e gömülür (aynı
  # INSTALLER_GHCR_TOKEN secret'ı) → müşteri token GİRMEZ. Release asset'i private
  # repo'da yalnız yetkili indirir; asıl kullanım gate'i Ed25519 lisans.
  linux-installer:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Embed GHCR creds into install-linux.sh
        env:
          GHCR_TOKEN: ${{ secrets.INSTALLER_GHCR_TOKEN }}
        run: |
          # Placeholder'ları gerçek değerlerle değiştir — YALNIZ tanım satırlarında
          # (/^EMBED_.../ adresi). Global s###g script'in kendi guard satırlarını da
          # değiştirip az önce gömülen GERÇEK değeri boşaltıyordu → müşteri sürümü
          # "GHCR token bulunamadı" ile düşüyordu (v1.4.1-v1.4.3 sahada). Token alfanümerik (ghp_/
          # github_pat_) → sed '#' ayıracı ve '&' ile çakışmaz.
          sed -i \
            -e "/^EMBED_GHCR_USER=/s#__GHCR_USER__#${{ github.repository_owner }}#" \
            -e "/^EMBED_GHCR_IMAGE=/s#__GHCR_IMAGE__#ghcr.io/${{ github.repository }}#" \
            -e "/^EMBED_GHCR_TOKEN=/s#__GHCR_TOKEN__#${GHCR_TOKEN}#" \
            installer/install-linux.sh
          # Gömüldüğünü doğrula (placeholder kalmamalı; token'ı log'a basma).
          if grep -q "^EMBED_GHCR_TOKEN='__GHCR_TOKEN__'" installer/install-linux.sh; then
            echo "HATA: token gömülemedi (placeholder duruyor)."; exit 1
          fi
          if ! grep -qE "^EMBED_GHCR_TOKEN='.{20,}'" installer/install-linux.sh; then
            echo "HATA: gömülü token beklenenden kısa/boş."; exit 1
          fi

      - name: Attach Linux installer to release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/install-linux.sh
