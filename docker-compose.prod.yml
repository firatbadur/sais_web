name: sais_web

# ── SAHA (üretim) compose dosyası ───────────────────────────────────────────
# Yerel build YOK; image GHCR'dan çekilir. Watchtower :stable etiketini izleyip
# yeni sürüm geldiğinde SADECE app container'larını (web/worker/beat) yeniler.
# db (MSSQL) ve redis Watchtower'ın kapsamı DIŞINDA — verileri volume'de korunur.
#
# Kullanım (saha):
#   docker login ghcr.io            # read:packages PAT ile (bir kez)
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Sürüm dondurma / rollback: .env içinde IMAGE_TAG=v1.1.0 yapıp tekrar `up -d`.

x-app-image: &app-image ${GHCR_IMAGE:-ghcr.io/firatbadur/sais_web}:${IMAGE_TAG:-stable}

x-app-env: &app-env
  MSSQL_HOST: db
  MSSQL_PORT: 1433
  REDIS_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/2
  CELERY_RESULT_BACKEND: django-db
  MSSQL_DRIVER: "ODBC Driver 18 for SQL Server"

services:
  # Yedek volume izinlerini hazırla (SQL Server yazar, app siler/indirir).
  backup_init:
    image: busybox
    command: sh -c "mkdir -p /backups && chmod 0777 /backups"
    volumes:
      - mssql_backups:/backups

  # Caddy config volume izinlerini hazırla: web (non-root app) Caddyfile + cert
  # yazsın, caddy okusun.
  caddy_config_init:
    image: busybox
    command: sh -c "mkdir -p /etc/caddy/certs && chmod -R 0777 /etc/caddy"
    volumes:
      - caddy_config:/etc/caddy

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD:-Envisoft-21!}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    volumes:
      - mssql_data:/var/opt/mssql
      - mssql_backups:/var/opt/mssql/backups
    depends_on:
      backup_init:
        condition: service_completed_successfully
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" || exit 1"
      ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    # NOT: Watchtower label'ı YOK → asla otomatik güncellenmez (veri güvenliği).

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # NOT: Watchtower label'ı YOK → pinned, otomatik güncellenmez.

  web:
    image: *app-image
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      caddy_config_init:
        condition: service_completed_successfully
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles_root
      - mssql_backups:/var/opt/mssql/backups
      - caddy_config:/etc/caddy
    # NOT: web artık host'a publish edilmez; ingress Caddy (80/443) üzerinden.
    expose:
      - "8000"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    command: >
      sh -c "python manage.py ensure_database &&
             python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py seed_periodic_tasks &&
             (python manage.py refresh_license || true) &&
             (python manage.py render_caddyfile || true) &&
             gunicorn sais_web.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile - --error-logfile -"

  # Reverse proxy + otomatik HTTPS. Domain/SSL dashboard'dan (WebSettings) yönetilir;
  # web container Caddyfile'ı caddy_config volume'üne yazar, Caddy --watch ile reload eder.
  # db/redis gibi Watchtower KAPSAMI DIŞINDA (pinned) — cert verisi caddy_data'da korunur.
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
      caddy_config_init:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_config:/etc/caddy
      - caddy_data:/data
    command: caddy run --config /etc/caddy/Caddyfile --watch

  celery_worker:
    image: *app-image
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - mssql_backups:/var/opt/mssql/backups
    # web migrate'i bitirene kadar bekle (yeni kod eski şemayla çalışmasın).
    command: >
      sh -c "until python manage.py migrate --check; do echo 'migration bekleniyor...'; sleep 3; done &&
             celery -A sais_web worker -l info --concurrency=4"

  celery_beat:
    image: *app-image
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    command: >
      sh -c "until python manage.py migrate --check; do echo 'migration bekleniyor...'; sleep 3; done &&
             celery -A sais_web beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"

  watchtower:
    # Pinned (eski :latest, yeni Docker daemon API'siyle "client version 1.25 too
    # old" verip surekli restart oluyordu). 1.7.x modern API ile konusur.
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"        # sadece etiketli (app) container'ları izle
      # MONITOR_ONLY: OTOMATIK guncelleme YOK. Periyodik kontrol eder + yeni sürüm
      # gelince loglar, ama recreate ETMEZ. Yukseltme dashboard'dan manuel yapilir
      # (kullanici karari: oto-check evet, oto-update hayir).
      WATCHTOWER_MONITOR_ONLY: "true"
      WATCHTOWER_POLL_INTERVAL: "${WATCHTOWER_POLL_INTERVAL:-3600}"  # 1 saatte bir kontrol
      TZ: ${DJANGO_TIME_ZONE:-Europe/Istanbul}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # GHCR private ise sahada `docker login ghcr.io` yapıldıktan sonra bu mount
      # ile Watchtower aynı kimlikle kontrol eder:
      - ${DOCKER_CONFIG_DIR:-/root/.docker}/config.json:/config.json:ro

volumes:
  mssql_data:
  mssql_backups:
  redis_data:
  media_data:
  static_data:
  caddy_config:
  caddy_data:
