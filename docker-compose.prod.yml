name: sais_web

# ── SAHA (üretim) compose dosyası ───────────────────────────────────────────
# Yerel build YOK; image GHCR'dan çekilir. Watchtower :stable etiketini izleyip
# yeni sürüm geldiğinde SADECE app container'larını (web/worker/beat) yeniler.
# db (PostgreSQL) ve redis Watchtower'ın kapsamı DIŞINDA — verileri volume'de korunur.
#
# Kullanım (saha):
#   docker login ghcr.io            # read:packages PAT ile (bir kez)
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Sürüm dondurma / rollback: .env içinde IMAGE_TAG=v1.1.0 yapıp tekrar `up -d`.

x-app-image: &app-image ${GHCR_IMAGE:-ghcr.io/firatbadur/sais_web}:${IMAGE_TAG:-stable}

x-app-env: &app-env
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  REDIS_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/2
  CELERY_RESULT_BACKEND: django-db
  # Dashboard "Şimdi Güncelle" butonu Watchtower HTTP API'sini bu token'la çağırır.
  WATCHTOWER_API_TOKEN: "${WATCHTOWER_API_TOKEN:-envisoft-update-token}"

services:
  # Caddy config volume izinlerini hazırla: web (non-root app) Caddyfile + cert
  # yazsın, caddy okusun.
  caddy_config_init:
    image: busybox
    command: sh -c "mkdir -p /etc/caddy/certs && chmod -R 0777 /etc/caddy"
    volumes:
      - caddy_config:/etc/caddy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-envisoft}
      POSTGRES_USER: ${POSTGRES_USER:-envisoft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-envisoft}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    # NOT: Watchtower label'ı YOK → asla otomatik güncellenmez (veri güvenliği).

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # NOT: Watchtower label'ı YOK → pinned, otomatik güncellenmez.

  web:
    image: *app-image
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      caddy_config_init:
        condition: service_completed_successfully
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles_root
      - pg_backups:/backups
      - caddy_config:/etc/caddy
    # NOT: web artık host'a publish edilmez; ingress Caddy (80/443) üzerinden.
    expose:
      - "8000"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    command: >
      sh -c "python manage.py ensure_database &&
             python manage.py migrate --noinput &&
             (python manage.py detect_power_off || true) &&
             python manage.py collectstatic --noinput &&
             python manage.py seed_periodic_tasks &&
             (python manage.py refresh_license || true) &&
             (python manage.py render_caddyfile || true) &&
             gunicorn sais_web.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile - --error-logfile -"

  # Reverse proxy + otomatik HTTPS. Domain/SSL dashboard'dan (WebSettings) yönetilir;
  # web container Caddyfile'ı caddy_config volume'üne yazar, Caddy --watch ile reload eder.
  # db/redis gibi Watchtower KAPSAMI DIŞINDA (pinned) — cert verisi caddy_data'da korunur.
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
      caddy_config_init:
        condition: service_completed_successfully
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_config:/etc/caddy
      - caddy_data:/data
    command: caddy run --config /etc/caddy/Caddyfile --watch

  celery_worker:
    image: *app-image
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - pg_backups:/backups
    # Image'in HEALTHCHECK'i web (localhost:8000) icindir; celery HTTP sunmaz ->
    # devre disi (yoksa container "unhealthy" gorunur).
    healthcheck:
      disable: true
    # web migrate'i bitirene kadar bekle (yeni kod eski şemayla çalışmasın).
    command: >
      sh -c "until python manage.py migrate --check; do echo 'migration bekleniyor...'; sleep 3; done &&
             celery -A sais_web worker -l info --concurrency=4"

  celery_beat:
    image: *app-image
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      disable: true
    command: >
      sh -c "until python manage.py migrate --check; do echo 'migration bekleniyor...'; sleep 3; done &&
             celery -A sais_web beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"

  watchtower:
    # Pinned (eski :latest, yeni Docker daemon API'siyle "client version 1.25 too
    # old" verip surekli restart oluyordu). 1.7.x modern API ile konusur.
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    environment:
      # Yeni Docker daemon (v28+, WSL) min API 1.40 istiyor; watchtower istemcisi
      # 1.25 deniyordu -> "client version too old" -> surekli restart. Sabitle.
      DOCKER_API_VERSION: "1.43"
      WATCHTOWER_LABEL_ENABLE: "true"        # sadece etiketli (app) container'ları
      WATCHTOWER_CLEANUP: "true"             # eski image'ları sil
      # OTOMATIK guncelleme YOK. Periyodik tarama kapali; yukseltme yalnizca
      # HTTP API ile (dashboard "Simdi Guncelle" butonu) tetiklenir.
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_TOKEN: "${WATCHTOWER_API_TOKEN:-envisoft-update-token}"
      TZ: ${DJANGO_TIME_ZONE:-Europe/Istanbul}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # GHCR private ise sahada `docker login ghcr.io` yapıldıktan sonra bu mount
      # ile Watchtower aynı kimlikle kontrol eder:
      - ${DOCKER_CONFIG_DIR:-/root/.docker}/config.json:/config.json:ro

volumes:
  pg_data:
  pg_backups:
  redis_data:
  media_data:
  static_data:
  caddy_config:
  caddy_data:
